<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End of Brainrot - SteltheOwner</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff; font-family: 'Courier New', Courier, monospace;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        /* Container Cerita */
        #story-container {
            width: 80%; max-width: 800px; text-align: center;
        }

        #text-content {
            font-size: 22px; line-height: 1.6; min-height: 200px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Logo Final */
        #final-screen {
            display: none; opacity: 0; transition: opacity 2s;
            text-align: center;
        }

        .logo {
            font-size: 60px; font-weight: 900; color: #fff;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            margin-bottom: 20px;
        }

        .release-date {
            font-size: 28px; color: #ffeb3b; letter-spacing: 5px;
        }

        .status {
            margin-top: 40px; color: red; font-size: 18px;
            border: 2px solid red; padding: 10px; display: inline-block;
        }

        /* Timer di bucu skrin */
        #timer {
            position: absolute; top: 20px; right: 20px;
            font-size: 30px; color: #444;
        }
    </style>
</head>
<body>

    <div id="timer">0:00</div>

    <div id="story-container">
        <div id="text-content"></div>
    </div>

    <div id="final-screen">
        <div class="logo">STEAL THE BRAINROT ⛓️⛓️</div>
        <div class="release-date">RELEASED: 3 MARCH 2026</div>
        <div class="status">GAME STATUS: OVER & LOCKED</div>
        <p style="color: #666; margin-top: 20px;">Terima kasih daripada SteltheOwner.</p>
    </div>

    <script>
        const textContent = document.getElementById('text-content');
        const timerEl = document.getElementById('timer');
        const finalScreen = document.getElementById('final-screen');
        const storyContainer = document.getElementById('story-container');

        const stories = [
            "Segalanya bermula dengan satu impian...",
            "Mula-mula, HTML disusun satu persatu. Struktur yang kosong, tanpa nyawa.",
            "Kemudian datang CSS. Berjam-jam SteltheOwner duduk depan skrin...",
            "Hanya untuk pastikan warna, kedudukan, dan cahaya merah 'Legend' itu sempurna.",
            "Tapi cabaran sebenar adalah JavaScript.",
            "Beribu baris kod, logik 'BigInt' yang pening, sistem VVIP 400 Billion...",
            "Berapa kali ralat (error) muncul? Berapa kali rasa nak putus asa?",
            "Namun, SteltheOwner tak berhenti. Game ini dibina dengan titik peluh sendiri.",
            "Dari kosong sehingga menjadi sebuah empayar Brainrot.",
            "Hari ini, 26 Mac 2026... Perjalanan ini sampai ke penghujungnya.",
            "Kisah ini akan kekal dalam sejarah kod.",
            "Masa sudah tamat."
        ];

        let storyIndex = 0;
        let seconds = 0;

        // Fungsi Taip Text
        function typeStory() {
            if (storyIndex < stories.length) {
                textContent.style.opacity = 0;
                setTimeout(() => {
                    textContent.innerText = stories[storyIndex];
                    textContent.style.transition = "opacity 1s";
                    textContent.style.opacity = 1;
                    storyIndex++;
                }, 1000);
            }
        }

        // Timer & Control
        const interval = setInterval(() => {
            seconds++;
            let displaySec = seconds < 10 ? '0' + seconds : seconds;
            timerEl.innerText = `0:${displaySec}`;

            // Tukar cerita setiap 4.5 saat
            if (seconds % 5 === 0 && seconds < 55) {
                typeStory();
            }

            // MASA TAMAT: 0:59
            if (seconds >= 59) {
                clearInterval(interval);
                storyContainer.style.display = 'none';
                timerEl.style.display = 'none';
                
                finalScreen.style.display = 'block';
                setTimeout(() => {
                    finalScreen.style.opacity = 1;
                }, 100);

                // LOCK GAME: Padam data dari LocalStorage terus!
                localStorage.clear();
                console.log("GAME LOCKED BY OWNER.");
            }
        }, 1000);

        // Mula cerita pertama
        typeStory();
    </script>
</body>
</html>

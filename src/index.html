<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal the Brainrot - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Steal the Brainrot 🧠</h1>
        
        <div class="stats">
            <p>Skor: <span id="score">0</span></p>
            <p>Waktu: <span id="timer">20</span>s</p>
            <p style="color: #00ff00;">Rekor Tertinggi: <span id="high-score">0</span></p>
        </div>

        <div id="game-board"></div>

        <div class="controls">
            <button id="start-btn">Mulai Curi!</button>
            <button id="pause-btn" disabled>Pause</button>
            <button id="save-btn">Simpan Skor</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
